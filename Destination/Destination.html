    <header>
      <picture class="logo">
        <source srcset="../assets/desktop/logo.png" media="min-width: 1440px" />
        <source srcset="../assets/tablet/logo.png" media="min-width: 768px" />
        <img src="../assets/mobile/logo.png" alt="logo" />
      </picture>
      <nav id="nav" class="hidden burger_menu_div">
        <img
          src="../assets/mobile/exit.png"
          alt="exit"
          id="exit"
          class="exit_btn"

        <ul>
          <a href="../index.html">

            <span>HOME</span>

        id="burger_menu"

    <main>
      <h1><span>01</span>Pick your destination</h1>
      <section class="main_sec">
        <img src="" alt="plannet" id="img" class="img" />
        <div class="info_div">
          <nav class="main_nav">
            <ul>
              <li class="planets">MOON</li>
              <li class="planets">MARS</li>
              <li class="planets">EUROPA</li>
              <li class="planets">TITAN</li>
            </ul>
          </nav>
          <h2 id="name" class="name"></h2>
          <p id="desc" class="desc"></p>
          <div class="Line"></div>
          <div class="info_box">
            <div class="avg_box">
              <h3 class="avg_dist">AVG. DISTANCE</h3>
              <p class="avg_dist_p" id="dist"></p>
            </div>
            <div class="travel_box">
              <h3 class="travel_time">Est. travel time</h3>
              <p class="travel_time_p" id="travel"></p>
            </div>
          </div>
        </div>
      </section>
    </main>
